<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RANDFALS — animasjon</title>
<!--
  Modulruter blinker opp på tilfeldige steder over flaten. Rutene som treffer bokstavene blir stående,
  til hele ordmerket står. Så blir det stående.
  Bruk på nettsiden: kopier <svg id="rf-anim"> og <script> inn i siden. Fargen følger CSS «color».
  Parametre: ?bg=0B0B0B&fg=F4F3EF   ?still=1 (bare sluttbildet)
-->
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:var(--bg,#F4F3EF);color:var(--fg,#0B0B0B)}
  #rf-anim{width:min(86vw,980px);height:auto;display:block}
</style>
</head>
<body>
<svg id="rf-anim" viewBox="-420 -420 6300 1540" role="img" aria-label="RANDFALS">
  <defs><mask id="rf-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="5460" height="700"><g id="rf-cells"></g></mask></defs>
  <g id="rf-noise" fill="currentColor"></g>
  <path mask="url(#rf-mask)" fill="currentColor" d="M0 700V0H420V140H560V420H420L560 700H420L280 420H140V700ZM140 280H420V140H140ZM700 700V140H840V0H1260V700H1120V420H840V700ZM840 280H1120V140H840ZM1400 700V0H1820V140H1960V700H1820V140H1540V700ZM2100 700V0H2520V140H2660V700ZM2240 560H2520V140H2240ZM2800 700V0H3360V140H2940V280H3220V420H2940V700ZM3500 700V140H3640V0H4060V700H3920V420H3640V700ZM3640 280H3920V140H3640ZM4200 700V0H4340V560H4760V700ZM4900 700V560H5320V420H4900V0H5460V140H5040V280H5460V700Z"/>
</svg>
<script>
(function () {
  const U = 140, COLS = 39, ROWS = 5;
  const BUILD = 2.6;                 // sekunder til ordet er komplett
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.body.style.setProperty("--bg", "#" + q.get("bg"));
  if (q.get("fg")) document.body.style.setProperty("--fg", "#" + q.get("fg"));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // fast frø: animasjonen er «tilfeldig», men lik hver gang
  let seed = 20261017;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const ns = "http://www.w3.org/2000/svg";
  const rect = (parent, x, y, fill) => { const r = document.createElementNS(ns, "rect");
    r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", U); r.setAttribute("height", U); r.setAttribute("shape-rendering", "crispEdges");
    if (fill) r.setAttribute("fill", fill); r.style.display = "none"; parent.appendChild(r); return r; };

  // 1) ruter i bokstavene: dukker opp i tilfeldig rekkefølge og blir stående (tettere mot slutten)
  const keep = [], gCells = document.getElementById("rf-cells");
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++)
    keep.push({ el: rect(gCells, c * U, r * U, "#fff"), on: 0.15 + Math.pow(rnd(), 0.75) * (BUILD - 0.15) });

  // 2) støy over hele flaten: korte blink, flest i starten, ingen etter at ordet er ferdig
  const noise = [], gNoise = document.getElementById("rf-noise");
  for (let i = 0; i < 230; i++) {
    const c = Math.floor(rnd() * 45) - 3, r = Math.floor(rnd() * 11) - 3;
    const on = Math.pow(rnd(), 1.3) * (BUILD - 0.25);
    noise.push({ el: rect(gNoise, c * U, r * U), on, off: on + 0.07 + rnd() * 0.2 });
  }


  function render(t) {
    for (const k of keep) k.el.style.display = t >= k.on ? "" : "none";
    for (const n of noise) n.el.style.display = (t >= n.on && t < n.off) ? "" : "none";
  }
  window.rfRender = render;                       // brukes ved videoeksport
  const END = BUILD;
  if (reduce || q.get("still") === "1") { render(END); return; }
  let t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    render(t);
    if (t < END) requestAnimationFrame(frame);
  }
  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
